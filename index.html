<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <style>
    /* Variables de thèmes */
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card-front: #1e293b;
      --card-back: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #020617;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #f43f5e;
      --danger-hover: #e11d48;
      --border: #475569;
      --box-bg: rgba(30, 41, 59, 0.5);
      --shadow: rgba(0, 0, 0, 0.4);
    }

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --card-front: #ffffff;
      --card-back: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --danger: #e11d48;
      --danger-hover: #be123c;
      --border: #cbd5e1;
      --box-bg: rgba(255, 255, 255, 0.8);
      --shadow: rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    /* Bouton thème (haut à droite) */
    #theme-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--card-front);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.8rem;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 2px 5px var(--shadow);
      z-index: 100;
    }

    #theme-toggle:hover {
      border-color: var(--accent);
    }

    /* Notification (Toast) */
    #toast {
      position: fixed;
      top: 20px;
      background: var(--accent);
      color: #ffffff;
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px var(--shadow);
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Configuration */
    #setup-view {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-top: 2rem;
    }

    .setup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preset-box {
      background: var(--box-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }

    textarea {
      width: 100%;
      height: 200px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.95rem;
      resize: vertical;
    }

    textarea:focus, select:focus {
      outline: 2px solid var(--accent);
    }

    .controls-row {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    select {
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.65rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    button.secondary {
      background-color: var(--card-back);
      color: var(--text);
    }

    button.secondary:hover {
      background-color: var(--border);
    }

    button.danger {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    button.danger:hover {
      background-color: var(--danger);
      color: #ffffff;
    }

    /* Vue Flashcards */
    #app-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 650px;
      margin-top: 2rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .counter {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-muted);
    }

    /* Scène 3D */
    .scene {
      width: 100%;
      height: 360px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      box-shadow: 0 10px 25px var(--shadow);
      border-radius: 12px;
    }

    .card.is-flipped {
      transform: rotateX(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2.5rem;
      text-align: center;
      border-radius: 12px;
      border: 2px solid var(--border);
    }

    .card-front {
      background-color: var(--card-front);
    }

    .card-back {
      background-color: var(--card-back);
      transform: rotateX(180deg);
    }

    .card-text {
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.4;
      word-break: break-word;
    }

    .face-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.15);
      padding: 4px 10px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .card-nav {
      display: flex;
      gap: 1rem;
      width: 100%;
      justify-content: center;
    }

    .nav-btn {
      flex: 1;
      padding: 0.75rem;
    }

    .help-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    kbd {
      background: var(--card-front);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- Bouton Thème -->
  <button id="theme-toggle" title="Basculer le thème">
    <span id="theme-icon">☀️</span>
  </button>

  <div id="toast">Cartes mélangées !</div>

  <!-- ÉCRAN CONFIGURATION -->
  <div id="setup-view">
    <div class="setup-header">
      <h2>Flashcards</h2>
      <button id="clear-input-btn" class="danger">Tout effacer</button>
    </div>

    <!-- Menus des decks préexistants -->
    <div class="preset-box">
      <label for="github-deck-select">Sélectionner un fichier préexistant (Dépôt GitHub) :</label>
      <select id="github-deck-select">
        <option value="">Recherche des fichiers...</option>
      </select>
    </div>

    <div>
      <label for="csv-input">Ou collez votre liste CSV / texte ci-dessous :</label>
      <textarea id="csv-input" placeholder="Question 1 ; Réponse 1&#10;Question 2 ; Réponse 2&#10;Question 3 ; Réponse 3"></textarea>
    </div>

    <div class="controls-row">
      <div>
        <label for="delimiter">Séparateur : </label>
        <select id="delimiter">
          <option value="auto">Détection automatique</option>
          <option value=";">Point-virgule ( ; )</option>
          <option value="/">Slash ( / )</option>
          <option value=",">Virgule ( , )</option>
          <option value="\t">Tabulation</option>
        </select>
      </div>

      <div style="margin-left: auto; display: flex; gap: 0.5rem;">
        <button id="start-btn">Démarrer</button>
      </div>
    </div>
  </div>

  <!-- ÉCRAN FLASHCARDS -->
  <div id="app-view">
    <div class="top-bar">
      <button id="edit-btn" class="secondary" title="Vider et changer de liste">Changer de liste</button>
      <span class="counter" id="counter">Carte 0 / 0</span>
      <button id="shuffle-btn" class="secondary" title="Mélanger l'ordre des cartes">🔀 Mélanger</button>
    </div>

    <div class="scene" id="card-scene">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="face-badge">Recto</div>
          <div class="card-text" id="recto-text"></div>
        </div>
        <div class="card-face card-back">
          <div class="face-badge">Verso</div>
          <div class="card-text" id="verso-text"></div>
        </div>
      </div>
    </div>

    <div class="card-nav">
      <button id="prev-btn" class="secondary nav-btn">← Précédent</button>
      <button id="flip-btn" class="nav-btn">Retourner (Espace)</button>
      <button id="next-btn" class="secondary nav-btn">Suivant →</button>
    </div>

    <div class="help-hint">
      Navigation : <kbd>←</kbd> Précédente | <kbd>→</kbd> Suivante | <kbd>↑</kbd> <kbd>↓</kbd> ou <kbd>Espace</kbd> Retourner
    </div>
  </div>

  <script>
    // Configuration GitHub facultative pour les tests en local (ex: file:///)
    const MANUAL_GITHUB_USER = ''; 
    const MANUAL_GITHUB_REPO = ''; 

    let cards = [];
    let currentIndex = 0;
    let isFlipped = false;

    // Éléments UI
    const setupView = document.getElementById('setup-view');
    const appView = document.getElementById('app-view');
    const csvInput = document.getElementById('csv-input');
    const startBtn = document.getElementById('start-btn');
    const editBtn = document.getElementById('edit-btn');
    const clearInputBtn = document.getElementById('clear-input-btn');
    const cardElement = document.getElementById('card');
    const rectoText = document.getElementById('recto-text');
    const versoText = document.getElementById('verso-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const flipBtn = document.getElementById('flip-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const counter = document.getElementById('counter');
    const delimiterSelect = document.getElementById('delimiter');
    const githubSelect = document.getElementById('github-deck-select');
    const toast = document.getElementById('toast');
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    /* --- GESTION DU THÈME --- */
    function initTheme() {
      const savedTheme = localStorage.getItem('fc_theme') || 'dark';
      setTheme(savedTheme);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('fc_theme', theme);
      themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    initTheme();

    /* --- NOTIFICATION (TOAST) --- */
    let toastTimeout;
    function showToast(message) {
      toast.innerText = message;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    /* --- LECTURE DU DOSSIER DECKS GITHUB --- */
    async function loadGitHubDecks() {
      let user = MANUAL_GITHUB_USER;
      let repo = MANUAL_GITHUB_REPO;

      if (!user || !repo) {
        const host = window.location.hostname;
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        if (host.endsWith('.github.io') && pathParts.length > 0) {
          user = host.replace('.github.io', '');
          repo = pathParts[0];
        }
      }

      if (!user || !repo) {
        githubSelect.innerHTML = '<option value="">(Détection active sur GitHub Pages)</option>';
        githubSelect.disabled = true;
        return;
      }

      try {
        const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/decks`;
        const res = await fetch(apiUrl);

        if (!res.ok) {
          githubSelect.innerHTML = '<option value="">(Dossier /decks non trouvé sur le dépôt)</option>';
          githubSelect.disabled = true;
          return;
        }

        const files = await res.json();
        const csvFiles = files.filter(f => f.name.toLowerCase().endsWith('.csv'));

        if (csvFiles.length === 0) {
          githubSelect.innerHTML = '<option value="">(Aucun fichier .csv trouvé dans /decks)</option>';
          githubSelect.disabled = true;
          return;
        }

        githubSelect.innerHTML = '<option value="">-- Choisir une liste existante --</option>';
        csvFiles.forEach(file => {
          const opt = document.createElement('option');
          opt.value = file.download_url;
          opt.textContent = file.name.replace(/\.[^/.]+$/, "");
          githubSelect.appendChild(opt);
        });

      } catch (err) {
        console.error(err);
        githubSelect.innerHTML = '<option value="">(Impossible de charger les fichiers)</option>';
        githubSelect.disabled = true;
      }
    }

    githubSelect.addEventListener('change', async () => {
      const url = githubSelect.value;
      if (!url) return;

      csvInput.value = "Chargement en cours...";
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error();
        const text = await res.text();
        csvInput.value = text;
      } catch (e) {
        alert("Erreur lors du téléchargement du fichier.");
        csvInput.value = "";
      }
    });

    loadGitHubDecks();

    /* --- FONCTIONS MÉMOIRE ET CARTES --- */
    clearInputBtn.addEventListener('click', () => {
      if (confirm("Voulez-vous effacer le contenu actuel ?")) {
        csvInput.value = "";
        githubSelect.value = "";
        cards = [];
      }
    });

    function detectDelimiter(text) {
      if (delimiterSelect.value !== 'auto') {
        return delimiterSelect.value === '\\t' ? '\t' : delimiterSelect.value;
      }
      const firstLine = text.split('\n').find(l => l.trim().length > 0) || '';
      const counts = {
        ';': (firstLine.match(/;/g) || []).length,
        '/': (firstLine.match(/\//g) || []).length,
        ',': (firstLine.match(/,/g) || []).length,
        '\t': (firstLine.match(/\t/g) || []).length
      };
      return Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
    }

    // Mélange de Fisher-Yates
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function shuffleCurrentDeck() {
      if (cards.length <= 1) return;
      shuffleArray(cards);
      currentIndex = 0;
      showCard();
      showToast("Cartes mélangées ! 🔀");
    }

    function parseCards() {
      const text = csvInput.value.trim();
      if (!text) return alert("Veuillez coller des données ou sélectionner un fichier.");

      const delim = detectDelimiter(text);
      const lines = text.split('\n');
      cards = [];

      for (let line of lines) {
        if (!line.trim()) continue;
        const parts = line.split(delim);
        if (parts.length >= 2) {
          const front = parts[0].trim();
          const back = parts.slice(1).join(delim).trim();
          cards.push({ front, back });
        }
      }

      if (cards.length === 0) {
        return alert("Aucune carte valide trouvée. Vérifiez que votre séparateur correspond bien.");
      }

      currentIndex = 0;
      showCard();
      setupView.style.display = 'none';
      appView.style.display = 'flex';
    }

    function showCard() {
      if (isFlipped) {
        cardElement.classList.remove('is-flipped');
        isFlipped = false;
      }

      const card = cards[currentIndex];
      rectoText.innerText = card.front;
      versoText.innerText = card.back;
      counter.innerText = `Carte ${currentIndex + 1} / ${cards.length}`;

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === cards.length - 1;
    }

    function toggleFlip() {
      isFlipped = !isFlipped;
      cardElement.classList.toggle('is-flipped', isFlipped);
    }

    function nextCard() {
      if (currentIndex < cards.length - 1) {
        currentIndex++;
        showCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        showCard();
      }
    }

    startBtn.addEventListener('click', parseCards);
    shuffleBtn.addEventListener('click', shuffleCurrentDeck);

    editBtn.addEventListener('click', () => {
      appView.style.display = 'none';
      setupView.style.display = 'flex';
    });

    document.getElementById('card-scene').addEventListener('click', toggleFlip);
    flipBtn.addEventListener('click', toggleFlip);
    nextBtn.addEventListener('click', nextCard);
    prevBtn.addEventListener('click', prevCard);

    // Navigation Clavier
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === csvInput) return;

      if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.code === 'Space') {
        e.preventDefault();
        toggleFlip();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextCard();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevCard();
      }
    });
  </script>
</body>
</html>

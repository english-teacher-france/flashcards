<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards de Classe</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-front: #1e293b;
      --card-back: #334155;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #f43f5e;
      --border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    /* Notification visuelle (Toast) */
    #toast {
      position: fixed;
      top: 20px;
      background: rgba(56, 189, 248, 0.95);
      color: #0f172a;
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Écran de configuration */
    #setup-view {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .setup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preset-box {
      background: #1e293b80;
      border: 1px dashed var(--accent);
      padding: 1rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .preset-box label {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 1rem;
      border-radius: 8px;
      background: var(--card-front);
      color: var(--text);
      border: 1px solid var(--border);
      resize: vertical;
      font-size: 0.95rem;
    }

    .options {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    select, button {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s, background-color 0.2s;
    }

    select {
      background: var(--card-front);
      color: var(--text);
      border: 1px solid var(--border);
      width: 100%;
    }

    .options select {
      width: auto;
      flex: 1;
    }

    button.primary {
      background: var(--accent);
      color: #000;
      flex: 1.2;
    }

    button.secondary {
      background: var(--card-front);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    button.danger:hover {
      background: rgba(244, 63, 94, 0.15);
    }

    button:hover {
      opacity: 0.9;
    }

    /* Écran de révision */
    #app-view {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 650px;
      gap: 1.5rem;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .actions-group {
      display: flex;
      gap: 0.5rem;
    }

    .btn-text {
      background: transparent;
      color: #94a3b8;
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    .btn-text:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .btn-text.shuffle-btn {
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.4);
    }

    /* Animation de carte 3D */
    .scene {
      width: 100%;
      height: 380px;
      perspective: 1200px;
      cursor: pointer;
      user-select: none;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    .card.is-flipped {
      transform: rotateX(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 2px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .card-front {
      background-color: var(--card-front);
    }

    .card-back {
      background-color: var(--card-back);
      transform: rotateX(180deg);
    }

    .card-label {
      position: absolute;
      top: 1rem;
      left: 1.5rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      font-weight: 700;
    }

    .card-content {
      font-size: 1.4rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .nav-controls {
      display: flex;
      gap: 1rem;
      width: 100%;
    }

    .nav-controls button {
      background: var(--card-front);
      color: var(--text);
      border: 1px solid var(--border);
      flex: 1;
    }

    .instructions {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }

    .instructions kbd {
      background: #1e293b;
      border: 1px solid var(--border);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Toast de notification -->
  <div id="toast">✨ Cartes mélangées !</div>

  <!-- 1. Écran de configuration -->
  <div id="setup-view">
    <div class="setup-header">
      <h2>Flashcards</h2>
      <button class="danger" id="clear-btn" title="Vider la mémoire locale">
        🗑️ Réinitialiser
      </button>
    </div>

    <div class="preset-box">
      <label for="repo-files-select">📁 Choisir une liste préexistante (dépôt GitHub)</label>
      <select id="repo-files-select">
        <option value="">Recherche des fichiers dans /decks ...</option>
      </select>
    </div>

    <div>
      <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 0.4rem;">
        Ou collez directement votre liste manuelle ci-dessous :
      </p>
      <textarea id="csv-input" placeholder="Bonjour ; Hello&#10;Merci ; Thank you&#10;Pomme ; Apple"></textarea>
    </div>

    <div class="options">
      <select id="delimiter-select">
        <option value="auto">Détection auto du séparateur</option>
        <option value=";">Point-virgule (;)</option>
        <option value="/">Slash (/)</option>
        <option value=",">Virgule (,)</option>
        <option value="&#9;">Tabulation</option>
      </select>

      <button class="primary" id="start-btn">Démarrer (Ordre d'origine)</button>
    </div>
  </div>

  <!-- 2. Écran de révision -->
  <div id="app-view">
    <div class="header-bar">
      <span id="card-counter">Carte 0 / 0</span>
      <div class="actions-group">
        <button class="btn-text shuffle-btn" id="shuffle-btn" title="Mélanger à nouveau les cartes">
          🔀 Mélanger
        </button>
        <button class="btn-text" id="edit-btn">Modifier</button>
        <button class="btn-text" id="new-class-btn" style="color: var(--danger); border-color: rgba(244,63,94,0.4);">
          Changer de liste (Vider)
        </button>
      </div>
    </div>

    <div class="scene" id="card-scene">
      <div class="card" id="card-element">
        <div class="card-face card-front">
          <span class="card-label">Recto</span>
          <div class="card-content" id="recto-text">Question</div>
        </div>
        <div class="card-face card-back">
          <span class="card-label">Verso</span>
          <div class="card-content" id="verso-text">Réponse</div>
        </div>
      </div>
    </div>

    <div class="nav-controls">
      <button id="prev-btn">← Précédente</button>
      <button id="flip-btn">Pivoter</button>
      <button id="next-btn">Suivante →</button>
    </div>

    <div class="instructions">
      <kbd>↑</kbd> <kbd>↓</kbd> ou <kbd>Espace</kbd> pour pivoter | 
      <kbd>←</kbd> <kbd>→</kbd> pour naviguer
    </div>
  </div>

  <script>
    const GITHUB_DECKS_FOLDER = 'decks';
    const MANUAL_GITHUB_USER = ''; 
    const MANUAL_GITHUB_REPO = ''; 

    let cards = [];
    let currentIndex = 0;
    let isFlipped = false;
    let toastTimeout;

    const setupView = document.getElementById('setup-view');
    const appView = document.getElementById('app-view');
    const csvInput = document.getElementById('csv-input');
    const delimiterSelect = document.getElementById('delimiter-select');
    const repoFilesSelect = document.getElementById('repo-files-select');
    const toast = document.getElementById('toast');

    const startBtn = document.getElementById('start-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const clearBtn = document.getElementById('clear-btn');
    const editBtn = document.getElementById('edit-btn');
    const newClassBtn = document.getElementById('new-class-btn');

    const cardElement = document.getElementById('card-element');
    const rectoText = document.getElementById('recto-text');
    const versoText = document.getElementById('verso-text');
    const counter = document.getElementById('card-counter');

    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const flipBtn = document.getElementById('flip-btn');

    const savedData = localStorage.getItem('flashcards_data');
    if (savedData) csvInput.value = savedData;

    // Affiche le message temporaire
    function showNotification(message) {
      toast.innerText = message;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // Chargement dynamique des CSV du dépôt GitHub
    async function loadGitHubDecks() {
      let user = MANUAL_GITHUB_USER;
      let repo = MANUAL_GITHUB_REPO;

      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(Boolean);

      if (!user && host.endsWith('.github.io')) {
        user = host.split('.')[0];
        repo = pathParts[0] || '';
      }

      if (!user || !repo) {
        repoFilesSelect.innerHTML = '<option value="">(Détection repo GitHub active uniquement sur GitHub Pages)</option>';
        return;
      }

      const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${GITHUB_DECKS_FOLDER}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Dossier introuvable');

        const files = await response.json();
        const csvFiles = files.filter(file => file.type === 'file' && file.name.toLowerCase().endsWith('.csv'));

        if (csvFiles.length === 0) {
          repoFilesSelect.innerHTML = `<option value="">Aucun fichier .csv trouvé dans /${GITHUB_DECKS_FOLDER}</option>`;
          return;
        }

        repoFilesSelect.innerHTML = '<option value="">-- Sélectionnez un fichier CSV préenregistré --</option>';
        csvFiles.forEach(file => {
          const option = document.createElement('option');
          option.textContent = file.name.replace(/\.csv$/i, '');
          option.value = file.download_url;
          repoFilesSelect.appendChild(option);
        });

      } catch (err) {
        console.warn(err);
        repoFilesSelect.innerHTML = `<option value="">Dossier /${GITHUB_DECKS_FOLDER} non trouvé sur le dépôt</option>`;
      }
    }

    repoFilesSelect.addEventListener('change', async () => {
      const fileUrl = repoFilesSelect.value;
      if (!fileUrl) return;

      try {
        const res = await fetch(fileUrl);
        const text = await res.text();
        csvInput.value = text;
      } catch (e) {
        alert("Erreur lors du téléchargement du fichier.");
      }
    });

    loadGitHubDecks();

    function clearDatabase() {
      const confirmDelete = confirm("Voulez-vous réinitialiser et préparer une nouvelle liste ?");
      if (confirmDelete) {
        localStorage.removeItem('flashcards_data');
        csvInput.value = '';
        repoFilesSelect.value = '';
        cards = [];
        currentIndex = 0;
        appView.style.display = 'none';
        setupView.style.display = 'flex';
        csvInput.focus();
      }
    }

    clearBtn.addEventListener('click', clearDatabase);
    newClassBtn.addEventListener('click', clearDatabase);

    function detectDelimiter(text) {
      const candidates = [';', '/', '\t', ','];
      let best = ';';
      let maxCount = -1;
      for (let delim of candidates) {
        const count = (text.split(delim).length - 1);
        if (count > maxCount) {
          maxCount = count;
          best = delim;
        }
      }
      return best;
    }

    // Mélange Fisher-Yates
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Mélanger en session active
    function shuffleCurrentDeck() {
      if (cards.length <= 1) return;
      shuffleArray(cards);
      currentIndex = 0;
      showCard();
      showNotification("🔀 Les cartes ont été mélangées !");
    }

    function parseCards() {
      const text = csvInput.value.trim();
      if (!text) return alert("Veuillez sélectionner ou coller une liste de cartes.");

      localStorage.setItem('flashcards_data', text);

      let delim = delimiterSelect.value;
      if (delim === 'auto') delim = detectDelimiter(text);

      const lines = text.split('\n');
      cards = [];

      for (let line of lines) {
        if (!line.trim()) continue;
        const parts = line.split(delim);
        if (parts.length >= 2) {
          const front = parts[0].trim();
          const back = parts.slice(1).join(delim).trim();
          cards.push({ front, back });
        }
      }

      if (cards.length === 0) {
        return alert("Aucune carte valide trouvée. Vérifiez que votre séparateur correspond bien.");
      }

      // Par défaut : Ordre d'origine conservé (pas de shuffle ici)
      currentIndex = 0;
      showCard();

      setupView.style.display = 'none';
      appView.style.display = 'flex';
    }

    function showCard() {
      if (isFlipped) {
        cardElement.classList.remove('is-flipped');
        isFlipped = false;
      }

      const card = cards[currentIndex];
      rectoText.innerText = card.front;
      versoText.innerText = card.back;
      counter.innerText = `Carte ${currentIndex + 1} / ${cards.length}`;

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === cards.length - 1;
    }

    function toggleFlip() {
      isFlipped = !isFlipped;
      cardElement.classList.toggle('is-flipped', isFlipped);
    }

    function nextCard() {
      if (currentIndex < cards.length - 1) {
        currentIndex++;
        showCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        showCard();
      }
    }

    startBtn.addEventListener('click', parseCards);
    shuffleBtn.addEventListener('click', shuffleCurrentDeck);

    editBtn.addEventListener('click', () => {
      appView.style.display = 'none';
      setupView.style.display = 'flex';
    });

    document.getElementById('card-scene').addEventListener('click', toggleFlip);
    flipBtn.addEventListener('click', toggleFlip);
    nextBtn.addEventListener('click', nextCard);
    prevBtn.addEventListener('click', prevCard);

    // Navigation clavier
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === csvInput) return;

      if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.code === 'Space') {
        e.preventDefault();
        toggleFlip();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextCard();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevCard();
      }
    });
  </script>
</body>
</html>

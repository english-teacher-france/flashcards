<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <button id="theme-toggle" title="Basculer le thème">
    <span id="theme-icon">☀️</span>
  </button>

  <div id="toast">Cartes mélangées !</div>

  <!-- ÉCRAN CONFIGURATION -->
  <div id="setup-view">
    <div class="setup-header">
      <h2>Flashcards</h2>
      <button id="clear-input-btn" class="danger">Tout effacer</button>
    </div>

    <!-- Arbre des decks -->
    <div class="preset-box">
      <label>Decks du dépôt GitHub (cochez un ou plusieurs fichiers / dossiers) :</label>

      <div class="tree-toolbar">
        <input type="search" id="tree-filter" placeholder="Filtrer les decks…">
        <button id="expand-all-btn" class="secondary small" title="Tout déplier">Déplier</button>
        <button id="collapse-all-btn" class="secondary small" title="Tout replier">Replier</button>
        <button id="uncheck-all-btn" class="secondary small" title="Tout décocher">Décocher</button>
      </div>

      <div id="deck-tree">
        <div class="tree-message">Recherche des fichiers...</div>
      </div>

      <div class="tree-summary" id="tree-summary"></div>

      <div>
        <button id="load-selected-btn" class="secondary" disabled>Charger la sélection dans la zone de texte</button>
      </div>
    </div>

    <div>
      <label for="csv-input">Ou collez votre liste CSV / texte ci-dessous :</label>
      <textarea id="csv-input" placeholder="Question 1 ; Réponse 1&#10;Question 2 ; Réponse 2&#10;"Question, avec virgule" ; "Réponse sur&#10;deux lignes""></textarea>
    </div>

    <div class="controls-row">
      <div>
        <label for="delimiter">Séparateur : </label>
        <select id="delimiter">
          <option value="auto">Détection automatique</option>
          <option value=";">Point-virgule ( ; )</option>
          <option value="/">Slash ( / )</option>
          <option value=",">Virgule ( , )</option>
          <option value="\t">Tabulation</option>
        </select>
      </div>

      <div style="margin-left: auto; display: flex; gap: 0.5rem;">
        <button id="start-btn">Démarrer</button>
      </div>
    </div>
  </div>

  <!-- ÉCRAN FLASHCARDS -->
  <div id="app-view">
    <div class="top-bar">
      <button id="edit-btn" class="secondary" title="Vider et changer de liste">Changer de liste</button>
      <span class="counter" id="counter" aria-live="polite">Carte 0 / 0</span>
      <div class="top-bar-right">
        <button id="projection-btn" class="secondary" title="Agrandir la carte pour projection sur tableau" aria-pressed="false">🖥️ Tableau</button>
        <button id="shuffle-btn" class="secondary" title="Mélanger l'ordre des cartes">🔀 Mélanger</button>
      </div>
    </div>

    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="scene" id="card-scene">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="card-text" id="recto-text"></div>
        </div>
        <div class="card-face card-back">
          <div class="card-text" id="verso-text"></div>
        </div>
      </div>
    </div>

    <div class="card-nav">
      <button id="prev-btn" class="secondary nav-btn">← Précédent</button>
      <button id="flip-btn" class="nav-btn">Retourner (Espace)</button>
      <button id="next-btn" class="secondary nav-btn">Suivant →</button>
    </div>

    <div class="help-hint">
      <div class="kbd-hint">
        Navigation : <kbd>←</kbd> Précédente | <kbd>→</kbd> Suivante | <kbd>↑</kbd> <kbd>↓</kbd> ou <kbd>Espace</kbd> Retourner
      </div>
      <div class="touch-hint">
        Glissez ← → pour naviguer, ↑ ↓ pour retourner la carte
      </div>
    </div>
  </div>

</body>
</html>
